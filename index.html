<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#C3002F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="QFlowz">
<meta name="description" content="세종대학교 동아리 부원이 총무에게 직접 따져 묻지 않아도 회비 지출 근거를 확인하도록 돕는 결제 근거 카드 시연 앱">
<title>QFlowz - 동아리 회비 지출 근거 확인 서비스</title>
<style>
/* ===== 색·글자 토큰: ■5 수치를 한곳에 모아 다크 모드에서 한 번에 바꾸기 위함 ===== */
:root{
  --bg:#f7f8fa; --card:#ffffff; --text:#202020; --sub:#4A4F55;
  --accent:#C3002F; --accent-soft:#F3E6E9; --on-accent:#ffffff;
  --warn:#f08c00; --danger:#e03131; --ok:#2f9e44; --line:#e3e6ec;
  --mvp:#FFF8E1; --mvp-line:#f1d48a;
  --ok-soft:#e9f6ec; --warn-soft:#fff4e0; --danger-soft:#fdecec; --muted-soft:#eef0f3;
  --paper:#fffdf6; --frame:#202020;
  --shadow:0 2px 10px rgba(20,24,31,.07);
  --radius:12px; --btn-h:36px; --btn-r:8px;
  --font:-apple-system, BlinkMacSystemFont, "Malgun Gothic", "맑은 고딕", sans-serif;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#15171a; --card:#1f2226; --text:#eceef1; --sub:#b4bac2;
    --accent:#e2335a; --accent-soft:#3a1f27; --on-accent:#ffffff;
    --line:#33373d; --mvp:#3a3220; --mvp-line:#6b5a2c;
    --ok-soft:#1d3324; --warn-soft:#3a2c14; --danger-soft:#3d1d1e; --muted-soft:#2a2e33;
    --paper:#2a2a24; --frame:#000000;
    --shadow:0 2px 10px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.6;
  touch-action:manipulation;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
h1,h2,h3,h4,p{margin:0}
h1{font-size:24px;line-height:1.35}
h2{font-size:20px;line-height:1.4}
h3{font-size:16px;line-height:1.5}
.small,small{font-size:13px}
.sub{color:var(--sub)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ===== 페이지 틀: 노트북은 안내 패널 + 휴대폰 프레임 ===== */
.page{max-width:1100px;margin:0 auto;padding:16px;height:100%;display:flex;gap:24px;align-items:center;justify-content:center}
.panel{flex:0 0 360px;width:360px;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:12px;padding-right:4px}
.frame-wrap{flex:0 0 auto;position:relative;width:414px;height:868px}
.frame{position:absolute;left:0;top:0;width:414px;height:868px;border:12px solid var(--frame);border-radius:44px;
  background:var(--bg);box-shadow:0 12px 40px rgba(0,0,0,.18);overflow:hidden;transform-origin:0 0}
.notch{position:absolute;top:6px;left:50%;transform:translateX(-50%);width:120px;height:32px;background:#000;border-radius:16px;z-index:30}
.statusbar{position:absolute;top:0;left:0;right:0;height:40px;display:flex;align-items:center;justify-content:space-between;
  padding:0 22px;font-size:13px;font-weight:700;background:var(--card);z-index:20}
.app{position:absolute;top:40px;left:0;right:0;bottom:0;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.app-main{flex:1;display:flex;flex-direction:column;min-height:0}

/* ===== 앱 3단 구조: 헤더 / 스크롤 콘텐츠 / 하단 탭 ===== */
.hdr{flex:none;display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--card);color:var(--text)}
.hdr.treasurer{background:var(--accent);color:var(--on-accent);border-bottom-color:var(--accent)}
.hdr .role{font-weight:800;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .role small{display:block;font-weight:500;opacity:.85;line-height:1.2}
.icon-btn{min-width:36px;height:36px;border-radius:var(--btn-r);border:1px solid var(--line);background:transparent;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;padding:0 8px;font-size:15px}
.hdr.treasurer .icon-btn{border-color:rgba(255,255,255,.55);color:#fff}
.icon-btn[aria-pressed="true"]{background:var(--mvp);border-color:var(--mvp-line);color:var(--text)}
.txband{flex:none;display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--accent-soft);font-size:13px;border-bottom:1px solid var(--line)}
.txband .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txband button{height:28px;font-size:13px;padding:0 10px;border-radius:8px;border:1px solid var(--accent);background:var(--card);color:var(--accent);cursor:pointer;font-weight:700}
.content{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding:16px;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
.content.slide-in{animation:slideIn .25s ease-out}
@keyframes slideIn{from{transform:translateX(28px);opacity:.3}to{transform:none;opacity:1}}
.tabbar{flex:none;display:flex;overflow-x:auto;background:var(--card);border-top:1px solid var(--line);scrollbar-width:none;
  padding-bottom:env(safe-area-inset-bottom)}
.tabbar::-webkit-scrollbar{display:none}
.tab{flex:1 0 55px;min-width:55px;min-height:58px;border:0;background:transparent;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:0;font-size:12px;white-space:nowrap;color:var(--sub);padding:4px 2px;border-top:3px solid transparent}
.tab .ic{font-size:19px;line-height:1.2}
.tab[aria-current="page"]{color:var(--accent);font-weight:800;border-top-color:var(--accent);background:var(--accent-soft)}

/* ===== 카드·버튼 공통 ===== */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;min-width:0}
.card h3{margin-bottom:6px}
.stack{display:flex;flex-direction:column;gap:8px}
/* 스크롤 영역(.content) 안의 블록은 줄어들지 않게: 가로 스크롤 칩 줄(.chips)이 높이 0으로 눌려 다음 카드에 덮이던 문제 수정 */
.content>*,.stack>*{flex-shrink:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{height:var(--btn-h);min-height:var(--btn-h);border-radius:var(--btn-r);border:1px solid var(--line);background:var(--card);
  padding:0 14px;cursor:pointer;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  transition:transform .08s;white-space:nowrap;max-width:100%}
.btn:active,.tab:active,.chip:active,.txcard:active,.rolecard:active,.icon-btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.btn.tall{height:44px}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.next{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.chip{flex:none;height:32px;border-radius:16px;border:1px solid var(--line);background:var(--card);padding:0 12px;cursor:pointer;font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.notice{font-size:13px;color:var(--sub);background:var(--muted-soft);border-radius:8px;padding:8px 10px}
.notice.strong{border-left:4px solid var(--warn);background:var(--warn-soft);color:var(--text)}
.title-row{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.kv{display:grid;grid-template-columns:96px 1fr;gap:4px 10px;font-size:15px}
.kv dt{color:var(--sub);font-size:13px;padding-top:2px}
.kv dd{margin:0;word-break:keep-all;overflow-wrap:anywhere}
.amount{font-size:24px;font-weight:800;letter-spacing:-.3px}
.empty{text-align:center;padding:28px 12px}
.empty .big{font-size:40px}

/* ===== 상태 배지: 색 + 글자 + 아이콘을 함께 써서 색맹 사용자도 구분 ===== */
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 9px;font-size:13px;font-weight:700;border:1px solid;white-space:nowrap}
.b-match{color:var(--ok);background:var(--ok-soft);border-color:var(--ok)}
.b-mismatch{color:var(--danger);background:var(--danger-soft);border-color:var(--danger)}
.b-need{color:#b36200;background:var(--warn-soft);border-color:var(--warn)}
.b-pending{color:var(--sub);background:var(--muted-soft);border-color:var(--line)}
.b-done{color:var(--ok);background:var(--ok-soft);border-color:var(--ok)}
.b-explain{color:#b36200;background:var(--warn-soft);border-color:var(--warn)}
.b-wait{color:var(--sub);background:var(--muted-soft);border-color:var(--line)}
@media (prefers-color-scheme: dark){.b-need,.b-explain{color:#ffb84d}}

/* ===== 거래 카드 / 영수증 카드 / 대조 결과 카드를 서로 다르게 보이게 ===== */
.txcard{width:100%;text-align:left;cursor:pointer;display:block;background:var(--card);border:1px solid var(--line);
  border-left:5px solid var(--accent);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow)}
.txcard[aria-pressed="true"]{outline:2px solid var(--accent);background:var(--accent-soft)}
.txcard .top{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--sub)}
.txcard .mid{display:flex;justify-content:space-between;gap:8px;align-items:center;margin:2px 0}
.txcard .item{font-weight:800}
.txcard .won{font-weight:800;white-space:nowrap}
.txcard .why{font-size:13px;color:var(--sub);display:block}
.sec-tx{border-left:5px solid var(--accent)}
.sec-tx .head,.sec-rc .head,.sec-res .head{font-size:13px;font-weight:800;letter-spacing:.2px;margin-bottom:8px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.sec-tx .head{color:var(--accent)}
.sec-rc{background:var(--paper);border:2px dashed var(--line);box-shadow:none}
.receipt{font-family:ui-monospace,"Courier New",monospace;font-size:13px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px 12px;line-height:1.5}
.receipt .rhead{text-align:center;font-weight:800;border-bottom:1px dashed var(--line);padding-bottom:6px;margin-bottom:6px}
.receipt .rl{display:flex;justify-content:space-between;gap:8px}
.receipt .rtotal{border-top:1px dashed var(--line);margin-top:6px;padding-top:6px;font-weight:800}
.sec-res{border-width:2px}
.sec-res.r-match{background:var(--ok-soft);border-color:var(--ok)}
.sec-res.r-mismatch{background:var(--danger-soft);border-color:var(--danger)}
.sec-res.r-need{background:var(--warn-soft);border-color:var(--warn)}
.sec-res.r-pending{background:var(--muted-soft);border-style:dashed}
.cmp{width:100%;border-collapse:collapse;font-size:14px;table-layout:fixed}
.cmp th,.cmp td{border:1px solid var(--line);padding:6px 6px;text-align:left;vertical-align:top;overflow-wrap:anywhere}
.cmp thead th{background:var(--muted-soft);font-size:13px}
.cmp th[scope=row]{width:64px;font-size:13px;color:var(--sub);font-weight:600}
.cmp td.mark{width:34px;text-align:center}

/* ===== 익명 확인·최종 상태 ===== */
.vote-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vote-btns .btn{height:44px;white-space:normal;line-height:1.2}
.vote-btns .btn[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.bar{height:12px;border-radius:6px;background:var(--muted-soft);overflow:hidden;display:flex}
.bar .ok{background:var(--ok)} .bar .ask{background:var(--warn)}
.stat-big{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800}
.stat-big .ic{font-size:30px}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.metric{background:var(--muted-soft);border-radius:8px;padding:8px 10px}
.metric b{display:block;font-size:20px}
.metric span{font-size:13px;color:var(--sub)}
.status-card.s-done{border:2px solid var(--ok)}
.status-card.s-explain{border:2px solid var(--warn)}

/* ===== Q&A ===== */
.qa{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;background:var(--card)}
.qa .q{font-weight:700}
.qa .a{background:var(--muted-soft);border-radius:8px;padding:8px;font-size:15px}
.qa .meta{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:13px;color:var(--sub);flex-wrap:wrap}

/* ===== 혜택 탭·광고 띠: 결제 근거 카드와 헷갈리지 않게 점선 + '광고' 표시 ===== */
.perk{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--card)}
.perk .info{flex:1;min-width:0}
.perk .val{display:block;font-weight:800;color:var(--accent);font-size:14px}
.perk .meta{display:block;font-size:13px;color:var(--sub)}
.wallet{background:var(--muted-soft);border-radius:8px;padding:10px}
.adband{display:flex;gap:10px;align-items:center;border:1px dashed var(--sub);border-radius:var(--radius);padding:10px 12px;background:var(--muted-soft);font-size:13px}
.adband .adtag{flex:none;font-size:12px;font-weight:800;border:1px solid var(--sub);border-radius:4px;padding:0 6px;color:var(--sub)}
.adband .info{flex:1;min-width:0}

/* ===== 입력 폼 ===== */
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;font-weight:700;color:var(--sub)}
.field input,.field select,.field textarea{width:100%;min-height:40px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--card);font-size:16px}
.field textarea{min-height:72px;resize:vertical}
.field .err{color:var(--danger);font-size:13px;min-height:0}
.field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--danger)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.grid2>*{min-width:0}
.grid2 .btn{height:auto;white-space:normal;line-height:1.25;padding:6px 10px;text-align:center}
.field input,.field select,.field textarea{max-width:100%}
.hint{font-size:13px;color:var(--sub)}

/* ===== MVP 설명 모드 ===== */
.mvp-card{background:var(--mvp);border:1px solid var(--mvp-line);border-radius:var(--radius);padding:12px;font-size:14px}
.mvp-card .tag{display:inline-block;font-size:13px;font-weight:800;background:var(--card);border:1px solid var(--mvp-line);border-radius:999px;padding:0 8px;margin:0 4px 4px 0}
.mvp-card .row{margin-top:8px}
.mvp-card .btn{height:32px;font-size:13px}

/* ===== 로그인·PIN·권한 없음 ===== */
.center{display:flex;flex-direction:column;gap:14px;padding:24px 18px;flex:1;overflow-y:auto}
.logo{width:64px;height:64px;border-radius:18px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:32px;margin:8px auto 0}
.brand{text-align:center}
.brand h1{color:var(--accent)}
.rolecards{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.rolecard{display:flex;gap:12px;align-items:flex-start;border:2px solid var(--line);border-radius:var(--radius);padding:12px;background:var(--card);cursor:pointer}
.rolecard input{width:20px;height:20px;margin-top:4px;accent-color:var(--accent)}
.rolecard:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.rolecard b{display:block}
.pin-input{letter-spacing:12px;text-align:center;font-size:24px!important}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* ===== 바텀시트·모달 ===== */
.sheet-layer,.modal-layer{position:absolute;inset:0;z-index:50}
.sheet-layer[hidden],.modal-layer[hidden]{display:none}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.42);opacity:0;transition:opacity .25s}
.sheet-layer.open .backdrop,.modal-layer.open .backdrop{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;background:var(--card);border-radius:18px 18px 0 0;display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .25s ease-out;padding-bottom:env(safe-area-inset-bottom)}
.sheet-layer.open .sheet{transform:translateY(0)}
.sheet .grab{padding:8px 0 2px;display:flex;justify-content:center;cursor:grab;touch-action:none}
.sheet .grab span{width:44px;height:5px;border-radius:3px;background:var(--line)}
.sheet .shead{display:flex;align-items:center;justify-content:space-between;padding:4px 16px 8px;gap:8px;touch-action:none}
.sheet .sbody{overflow-y:auto;padding:0 16px 18px;display:flex;flex-direction:column;gap:10px;overscroll-behavior:contain}
.modal{position:absolute;left:20px;right:20px;top:50%;transform:translateY(-50%) scale(.96);opacity:0;transition:.2s;background:var(--card);border-radius:14px;padding:18px;
  display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.modal-layer.open .modal{opacity:1;transform:translateY(-50%) scale(1)}
.toast{position:absolute;right:12px;bottom:76px;z-index:60;background:#202020;color:#fff;font-size:13px;padding:6px 12px;border-radius:999px;
  opacity:0;transform:translateY(6px);transition:.2s;pointer-events:none}
.toast.show{opacity:1;transform:none}
.loglist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.loglist li{font-size:13px;border-bottom:1px solid var(--line);padding:6px 0;display:grid;grid-template-columns:110px 1fr;gap:6px}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.check input{width:20px;height:20px;margin-top:3px;flex:none;accent-color:var(--accent)}
.check small{display:block;color:var(--sub)}
.ue{width:100%;border-collapse:collapse;font-size:13px}
.ue th,.ue td{border:1px solid var(--line);padding:6px;text-align:left;vertical-align:top}
.ue th{background:var(--muted-soft)}
.journey{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.journey li{font-size:13px;padding:4px 8px;border-radius:6px;background:var(--muted-soft)}
.journey li.low{background:var(--danger-soft);border-left:4px solid var(--danger);font-weight:700}

/* ===== 노트북 안내 패널 ===== */
.panel .card{padding:14px}
.panel .brandline{display:flex;gap:10px;align-items:center}
.panel .brandline .logo{width:44px;height:44px;font-size:22px;margin:0;border-radius:12px}
.cp{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.cp button{width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 10px;cursor:pointer;font-size:14px}
.cp button b{color:var(--accent)}

/* ===== 휴대폰(720px 이하): 프레임·패널을 숨기고 앱이 화면 전체를 채움 ===== */
@media (max-width:720px){
  .page{padding:0;display:block;height:100dvh}
  .panel,.notch,.statusbar{display:none}
  .frame-wrap{width:100%!important;height:100dvh!important}
  .frame{position:static;width:100%!important;height:100dvh!important;border:0;border-radius:0;box-shadow:none;transform:none!important}
  .app{position:absolute;inset:0;padding-top:env(safe-area-inset-top);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
  .frame-wrap{position:relative}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

function 기본상태만들기() {
  const txs = CONFIG.seedTxs.map(t => {
    const tx = Object.assign({}, t);
    delete tx.mockResult;
    // 미리 정의한 모의 결과(CONFIG)를 그대로 표시하되, 근거 문장은 같은 규칙으로 만든다
    tx.result = t.mockResult ? { code: t.mockResult, detail: 규칙대조(tx).detail, at: t.date + 'T' + t.time } : null;
    return tx;
  });
  return {
    version: 2, mvpMode: false,
    team: {}, roadmap: [], modules: [], reports: [], meetings: [], journals: [], debates: [], submissions: [], todos: [],
    app: {
      session: { role: null, pinOk: false, pending: null },
      selectedTx: null,
      txs,
      votes: JSON.parse(JSON.stringify(CONFIG.seedVotes)),
      myVotes: {},
      qna: CONFIG.seedQna.map(q => Object.assign({}, q)),
      feeRules: CONFIG.feeRules.items.slice(),
      logs: [{ t: new Date().toISOString(), role: '시스템', action: '기본 시연 데이터 생성 (가상 거래 ' + txs.length + '건)', tx: '' }],
      checklist: {},
      filters: { status: 'all', category: 'all', qnaScope: 'selected' },
      drafts: {},
      ue: {},
      lastSaved: null,
      dataVer: 3,
      nextQ: 3
    }
  };
}
let state = 기본상태만들기();
let 직전페이지 = '';        // 같은 화면 재렌더 시 슬라이드 애니메이션을 생략하기 위함

/* =====================================================================
   3. 저장 / 복원 — 실패해도 절대 흰 화면이 되지 않도록 모두 try/catch
   ===================================================================== */
let 토스트타이머 = null, 저장타이머 = null;
function 토스트(msg) {
  const el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(토스트타이머);
  토스트타이머 = setTimeout(() => el.classList.remove('show'), 1500);
}
function 저장(조용히) {
  try {
    state.app.lastSaved = new Date().toISOString();
    // '__'로 시작하는 값은 화면 임시 상태(오류 문구 등)라 저장하지 않는다
    localStorage.setItem(CONFIG.storageKey, JSON.stringify(state, (k, v) => (k.startsWith('__') ? undefined : v)));
    if (!조용히) 토스트('저장됨 ✓');
    return true;
  } catch (e) {
    토스트('⚠️ 저장 실패 — 이 탭을 닫으면 사라집니다');
    return false;
  }
}
// 글자 입력처럼 잦은 변경은 0.4초 모아서 저장(매 글자마다 쓰기 방지)
function 지연저장() { clearTimeout(저장타이머); 저장타이머 = setTimeout(() => 저장(), 400); }

function 불러오기() {
  let raw = null;
  try { raw = localStorage.getItem(CONFIG.storageKey); }
  catch (e) { return { s: 기본상태만들기(), error: true }; }
  if (!raw) return { s: 기본상태만들기(), error: false, fresh: true };
  try {
    const s = JSON.parse(raw);
    if (!s || s.version !== 2 || !s.app || !Array.isArray(s.app.txs)) throw new Error('형식 불일치');
    // 규칙(이의 비율 분모·계좌 CSV 흐름)이 바뀌기 전 저장본은 섞이지 않게 기본 데이터로 새로 시작
    if (s.app.dataVer !== 3) return { s: 기본상태만들기(), error: false, fresh: true };
    return { s: 보정(s), error: false };
  } catch (e) {
    return { s: 기본상태만들기(), error: true };
  }
}
// 예전 버전 저장본에 없는 칸을 기본값으로 채워 렌더 중 undefined 오류를 막는다
function 보정(s) {
  const d = 기본상태만들기();
  for (const k of Object.keys(d)) if (s[k] === undefined) s[k] = d[k];
  for (const k of Object.keys(d.app)) if (s.app[k] === undefined || s.app[k] === null && k !== 'selectedTx' && k !== 'lastSaved') s.app[k] = d.app[k];
  if (!s.app.session || typeof s.app.session !== 'object') s.app.session = d.app.session;
  s.app.filters = Object.assign({}, d.app.filters, s.app.filters);
  return s;
}
function 로그(action, tx) {
  const role = state.app.session.role === 'treasurer' ? '총무' : state.app.session.role === 'member' ? '부원' : '방문자';
  state.app.logs.push({ t: new Date().toISOString(), role, action, tx: tx || '' });
}

/* =====================================================================
   4. 도메인 규칙 — 대조·판정 계산 (화면과 분리해 규칙을 한곳에서 설명)
   ===================================================================== */
// 규칙 기반 모의 비교: 실제 OCR·은행 연동이 아니라 입력된 가상 값끼리 비교만 한다
function 규칙대조(tx) {
  const 부족 = [];
  if (!tx.receiptNo) 부족.push('영수증 번호');
  if (!tx.receiptDate) 부족.push('영수증 날짜');
  if (!(Number(tx.receiptAmount) > 0)) 부족.push('영수증 금액');
  if (!tx.reason || !tx.reason.trim()) 부족.push('지출 사유');
  if (부족.length) return { code: 'need', detail: 부족.join('·') + ' 정보가 없어 비교할 수 없습니다(판독 불가).' };
  if (Number(tx.amount) !== Number(tx.receiptAmount)) {
    const diff = Math.abs(tx.amount - tx.receiptAmount);
    return { code: 'mismatch', detail: `거래 금액 ${원(tx.amount)}과 영수증 금액 ${원(tx.receiptAmount)}이 ${원(diff)} 다릅니다.` };
  }
  if (tx.date !== tx.receiptDate) return { code: 'need', detail: `금액은 같지만 거래일(${tx.date})과 영수증 날짜(${tx.receiptDate})가 다릅니다.` };
  return { code: 'match', detail: '거래 금액과 날짜가 영수증과 모두 같습니다.' };
}
function 결과코드(tx) { return tx && tx.result ? tx.result.code : 'pending'; }
// 집계 = 가상 기본 집계 + 이 브라우저에서 내가 고른 응답(1표). 개인 식별 정보는 없다

      <button type="submit" class="btn primary block tall" id="pin-ok">확인</button>

  </div>`;
}
/* ---------- S2 권한 없음 ---------- */

    <h2>이 화면은 총무 전용 화면입니다</h2>
    <p class="sub">부원 계정으로는 총무 관리 기능을 열 수 없어요. 대신 모든 지출 근거와 공개 Q&A는 부원 화면에서 그대로 볼 수 있습니다.</p>
    <button type="button" class="btn primary block tall" id="denied-back" data-act="godenied">거래 내역으로 돌아가기</button>
  </div>`;

/* ---------- 탭1 거래 내역 ---------- */
function 거래카드(tx, 선택) {
  return `<button type="button" class="txcard" id="txc-${esc(tx.id)}" data-act="pick" data-id="${esc(tx.id)}" aria-pressed="${선택}">
    <span class="top"><span>${esc(tx.id)} · ${esc(tx.date)}</span><span>${esc(tx.category)}</span></span>
    <span class="mid"><span class="item">${tx.item ? esc(tx.item) : esc(tx.merchant || '') + ' (근거 대기)'}</span><span class="won">${원(tx.amount)}</span></span>
    <span class="why">사유: ${tx.reason ? esc(tx.reason) : '⚠️ 사유 미기재'}</span>
    <span class="row" style="margin-top:6px">${대조배지(결과코드(tx))}${tx.reason ? 상태배지(집계(tx.id).code, 집계(tx.id).total) : '<span class="badge b-wait">⏳ 총무 근거 대기</span>'}${선택 ? '<span class="badge b-pending">✔ 선택됨</span>' : ''}</span>
  </button>`;
}
function 거래내역화면() {
  const f = state.app.filters;
  const all = state.app.txs;
  const list = all.filter(t => (f.status === 'all' || 결과코드(t) === f.status) && (f.category === 'all' || t.category === f.category));
  const 합계 = all.reduce((a, t) => a + Number(t.amount || 0), 0);
  const cnt = c => all.filter(t => 결과코드(t) === c).length;
  const 상태칩 = [['all', '전체'], ['match', '✅ 일치'], ['mismatch', '❌ 불일치'], ['need', '⚠️ 확인 필요'], ['pending', '⏳ 미대조']]
    .map(([v, l]) => `<button type="button" class="chip" id="fs-${v}" data-act="filter" data-k="status" data-v="${v}" aria-pressed="${f.status === v}">${l}</button>`).join('');
  const cats = ['all', ...CONFIG.categories.filter(c => all.some(t => t.category === c))];
  const 카테고리칩 = cats.map(c => `<button type="button" class="chip" id="fc-${c}" data-act="filter" data-k="category" data-v="${c}" aria-pressed="${f.category === c}">${c === 'all' ? '모든 카테고리' : c}</button>`).join('');
  return `<div class="title-row"><h2>📋 거래 내역</h2><span class="small sub">동아리 명의 계좌 · 가상</span></div>
    <div class="card"><div class="metrics">
      <div class="metric"><b>${all.length}건</b><span>공개된 지출</span></div>
      <div class="metric"><b>${원(합계)}</b><span>지출 합계</span></div>
      <div class="metric"><b>✅ ${cnt('match')} · ❌ ${cnt('mismatch')}</b><span>일치 · 불일치</span></div>
      <div class="metric"><b>⚠️ ${cnt('need')} · ⏳ ${cnt('pending')}</b><span>확인 필요 · 미대조</span></div>
    </div></div>
    <div class="stack" role="group" aria-label="대조 상태 필터"><div class="chips">${상태칩}</div></div>
    <div class="stack" role="group" aria-label="카테고리 필터"><div class="chips">${카테고리칩}</div></div>
    <p class="small sub">카드를 누르면 거래가 선택되고, 모든 탭에서 그 거래 기준으로 보여 줘요.</p>
    <div class="stack">${list.length ? list.map(t => 거래카드(t, t.id === state.app.selectedTx)).join('') : '<div class="card empty"><p>조건에 맞는 거래가 없습니다.</p></div>'}</div>
    ${광고띠()}
    <button type="button" class="btn block" id="open-rules" data-act="sheet" data-sheet="rules">📜 회비 운영 기준 보기 (${state.app.feeRules.length ? state.app.feeRules.length + '개 공개' : '미공개'})</button>
    <p class="notice">🏦 거래는 동아리 명의(고유번호증) 계좌의 거래내역에서만 들어옵니다. 총무는 금액·일시·가맹점을 고칠 수 없고 사유·영수증만 붙입니다. 시연 거래는 가상 데이터이며 실제 은행과 연동되지 않았습니다.</p>
    <button type="button" class="btn block" id="export-csv" data-act="export">📥 학기 장부 내려받기 (CSV · 엑셀에서 열림)</button>
    ${다음버튼([{ label: '결제 근거 보기 →', primary: true, attrs: state.app.selectedTx ? `id="next-evi" ${이동속성('evidence')}` : 'id="next-evi" data-act="sheet" data-sheet="select"' }])}`;
}

/* ---------- 영수증·결과 카드 조각 (결제 근거·모의 대조에서 재사용) ---------- */
function 영수증카드(tx) {
  const 있음 = tx.receiptNo || tx.receiptAmount > 0;
  return `<section class="card sec-rc" aria-label="영수증 요약">
    <div class="head"><span>🧾 영수증 요약</span><span class="small sub">시연용 영수증</span></div>
    ${tx.photo ? `<img src="${tx.photo}" alt="총무가 올린 영수증 사진" style="display:block;max-width:100%;max-height:220px;margin:0 auto 8px;border-radius:8px;border:1px solid var(--line)">` : ''}
    ${있음 ? `<div class="receipt">
      <div class="rhead">${esc(tx.merchant || '(가상) 가맹점')}<br><span class="small">시연용 가상 영수증 · 실물 아님</span></div>
      <div class="rl"><span>영수증 번호</span><span>${esc(tx.receiptNo || '— 없음')}</span></div>
      <div class="rl"><span>영수증 날짜</span><span>${esc(tx.receiptDate || '— 없음')}</span></div>
      <div class="rl"><span>품목</span><span>${esc(항목명(tx))}</span></div>
      <div class="rl rtotal"><span>합계</span><span>${tx.receiptAmount > 0 ? 원(tx.receiptAmount) : '— 없음'}</span></div>
    </div>` : `<div class="receipt" style="text-align:center">📭 영수증 미첨부<br><span class="small">비교할 영수증 정보가 없습니다</span></div>`}
  </section>`;
}
function 결과카드(tx, 실행버튼) {
  const code = 결과코드(tx);
  const r = CONFIG.results[code];
  return `<section class="card sec-res r-${code}" aria-label="대조 결과" aria-live="polite">
    <div class="head"><span>🔍 대조 결과</span>${대조배지(code)}</div>
    ${tx.result ? `<p><b>${r.icon} ${r.label}</b> — ${esc(tx.result.detail)}</p><p class="small sub">대조 시각 ${시각표시(tx.result.at)}</p>`
      : `<p>아직 모의 대조를 실행하지 않았습니다.</p>`}
    <p class="small sub" style="margin-top:4px">시연: 가상 데이터로 규칙 기반 모의 판정 · 실서비스: 총무 휴대폰 안의 AI 문자 인식(OCR)이 영수증 사진에서 날짜·금액을 읽어 같은 규칙으로 대조 · 사실 판단이 아닌 확인용 결과</p>
    ${실행버튼 || ''}
  </section>`;
}
function 익명버튼(tx, 접두) {
  if (!tx.reason) return `<p class="notice">⏳ 총무가 사유·영수증을 붙이면 익명 확인(${CONFIG.rules.periodDays}일)이 열립니다. 그 전에도 공개 Q&A로 물어볼 수 있습니다.</p>`;
  if (역할() === 'treasurer') return `<p class="notice">총무는 자신이 처리한 지출에 의견을 낼 수 없고, 집계만 볼 수 있습니다.</p>`;
  const mine = state.app.myVotes[tx.id];
  return `<div class="vote-btns" role="group" aria-label="익명 의견">
      <button type="button" class="btn" id="${접두}-ok" data-act="vote" data-v="ok" aria-pressed="${mine === 'ok'}">👍 근거 확인</button>
      <button type="button" class="btn" id="${접두}-ask" data-act="vote" data-v="ask" aria-pressed="${mine === 'ask'}">💬 설명 요청</button>
    </div>
    <button type="button" class="btn ghost block" id="${접두}-cancel" data-act="vote" data-v="cancel" ${mine ? '' : 'disabled'}>↩️ 응답 취소</button>
    <p class="small sub">${mine ? `내 응답: <b>${mine === 'ok' ? '근거 확인' : '설명 요청'}</b> (이 브라우저에만 저장, 다른 사람에게 공개되지 않음)` : '참여는 선택이며, 응답하지 않아도 근거를 확인할 수 있습니다.'}</p>`;
}
function QA목록(list, 접두) {
  if (!list.length) return '<p class="small sub">아직 등록된 질문이 없습니다.</p>';
  return list.map(q => `<article class="qa" aria-label="공개 질문 ${esc(q.id)}">
    <div class="meta"><span>${esc(q.txId)} · 익명 부원 · ${시각표시(q.qAt)}</span>${q.a ? '<span class="badge b-done">✔ 답변 완료</span>' : '<span class="badge b-wait">⏳ 답변 대기</span>'}</div>
    <p class="q">Q. ${esc(q.q)}</p>
    ${q.a ? `<div class="a"><b>총무 공개 답변</b> · <span class="small sub">${시각표시(q.aAt)}</span><br>${esc(q.a)}</div>`
      : (총무인가() ? `<form data-form="answer" data-id="${esc(q.id)}" class="stack">
          ${필드(`${접두}-ans-${q.id}`, '공개 답변 입력', `<textarea id="${접두}-ans-${esc(q.id)}" data-draft="ans-${esc(q.id)}" maxlength="400" placeholder="지출 근거를 중심으로 답변해 주세요">${esc(state.app.drafts['ans-' + q.id] || '')}</textarea>`, '')}
          <button type="submit" class="btn primary" id="${접두}-ansbtn-${esc(q.id)}">공개 답변 등록</button></form>` : '')}
  </article>`).join('');
}
function 질문폼(접두, 고정tx) {
  if (역할() === 'treasurer') return '';
  const opts = state.app.txs.map(t => `<option value="${esc(t.id)}" ${t.id === (고정tx || state.app.selectedTx) ? 'selected' : ''}>${esc(t.id)} · ${esc(항목명(t))}</option>`).join('');
  const err = state.__qErr && state.__qErr.form === 접두 ? state.__qErr : {};
  return `<form data-form="question" data-prefix="${접두}" class="stack" novalidate>
    ${고정tx ? `<input type="hidden" name="tx" value="${esc(고정tx)}">` : 필드(`${접두}-qtx`, '질문할 거래', `<select id="${접두}-qtx" name="tx"><option value="">거래를 선택하세요</option>${opts}</select>`, err.tx)}
    ${필드(`${접두}-q`, '공개 질문 (익명)', `<textarea id="${접두}-q" name="q" data-draft="q-${접두}" maxlength="300" placeholder="예: 이 지출의 인원 기준이 궁금합니다">${esc(state.app.drafts['q-' + 접두] || '')}</textarea>`, err.q, '특정 개인을 지목하지 말고 지출 내용에 대해 질문해 주세요. (최대 300자)')}
    <button type="submit" class="btn primary" id="${접두}-qbtn">질문 등록하기</button></form>`;
}

  return `<div class="title-row"><h2>🧾 결제 근거 카드</h2>${대조배지(결과코드(tx))}</div>

      <div class="head"><span>💳 계좌 거래 · ${esc(tx.id)}</span><span class="small sub">계좌 원본 · 수정 불가</span></div>
      <div class="amount">${원(tx.amount)}</div>

      </dl>
    </section>
    ${영수증카드(tx)}
    ${결과카드(tx, tx.result ? '' : `<button type="button" class="btn primary" id="evi-run" data-act="run">🔍 지금 모의 대조 실행</button>`)}

    </section>
    <section class="card" aria-label="공개 Q&A">

    </section>
    ${다음버튼([{ label: '모의 대조 하러 가기 →', primary: true, attrs: `id="next-cmp" ${이동속성('compare')}` }, { label: '다른 거래 선택', attrs: 'id="evi-pick" data-act="sheet" data-sheet="select"' }])}`;
}

/* ---------- 탭3 모의 대조 (킬러 기능 2단계) ---------- */
function 모의대조화면() {
  const tx = 선택거래();

          <tr><th scope="row">날짜</th><td>${esc(tx.date)}</td><td>${esc(tx.receiptDate || '— 없음')}</td><td class="mark">${표시(날짜같음)}</td></tr>
          <tr><th scope="row">번호</th><td>${esc(tx.id)}</td><td>${esc(tx.receiptNo || '— 없음')}</td><td class="mark">${실행됨 ? (tx.receiptNo ? '✔' : '❌') : '⏳'}</td></tr>
          <tr><th scope="row">사유</th><td colspan="2">${tx.reason ? esc(tx.reason) : '— 미기재'}</td><td class="mark">${실행됨 ? (tx.reason ? '✔' : '❌') : '⏳'}</td></tr>
        </tbody>
      </table>
    </div>
    <button type="button" class="btn primary block tall" id="cmp-run" data-act="run">🔍 모의 대조 실행</button>
    ${결과카드(tx)}

function 근거입력폼() {
  const 대상 = state.app.txs.filter(t => !t.reason || !t.item || (!t.receiptNo && !t.photo));
  const sel = 찾기(state.app.eviTarget) || 대상[0] || null;
  if (!sel) return `<section class="card"><h3>🧾 결제 근거 입력</h3><p class="small sub">근거가 비어 있는 거래가 없습니다. 위에서 계좌 거래내역을 가져오면 여기에 표시됩니다.</p></section>`;
  const d = (state.app.drafts.evi && state.app.drafts.evi.id === sel.id) ? state.app.drafts.evi : { id: sel.id, item: sel.item || '', category: sel.category || '', reason: sel.reason || '', receiptNo: sel.receiptNo || '', receiptDate: sel.receiptDate || '', receiptAmount: sel.receiptAmount ? String(sel.receiptAmount) : '' };
  const e = state.__eviErr || {};

function 시트그리기() {

    const box = !modal.hidden ? modal.querySelector('.modal') : (!sheet.hidden && 현재.sheet ? sheet.querySelector('.sheet') : null);
    if (!box) return;
    const items = [...box.querySelectorAll('button:not([disabled]), input, select, textarea, summary, [tabindex]:not([tabindex="-1"])')].filter(x => x.offsetParent !== null);
    if (!items.length) return;
    const first = items[0], last = items[items.length - 1];
    if (ev.shiftKey && document.activeElement === first) { last.focus(); ev.preventDefault(); }
    else if (!ev.shiftKey && document.activeElement === last) { first.focus(); ev.preventDefault(); }
    else if (!box.contains(document.activeElement)) { first.focus(); ev.preventDefault(); }
  }
});

// 바텀시트 끌어내려 닫기: 손잡이·제목 줄을 100px 이상 내리면 닫힘
(function 끌어내리기() {
  let 시작Y = null, 시트 = null, 거리 = 0;
  document.addEventListener('pointerdown', ev => {
    const h = ev.target.closest('[data-drag]');
    if (!h || ev.target.closest('button')) return;
    시트 = h.closest('.sheet'); 시작Y = ev.clientY; 거리 = 0;
    시트.style.transition = 'none';
  });
  document.addEventListener('pointermove', ev => {
    if (시작Y === null || !시트) return;
    거리 = Math.max(0, ev.clientY - 시작Y);
    시트.style.transform = `translateY(${거리}px)`;
  });
  const 끝 = () => {
    if (시작Y === null || !시트) return;
    시트.style.transition = ''; 시트.style.transform = '';
    if (거리 > 100) 시트닫기();
    시작Y = null; 시트 = null;
  };
  document.addEventListener('pointerup', 끝);
  document.addEventListener('pointercancel', 끝);
})();

window.addEventListener('hashchange', 라우트적용);

/* ---------- 프레임 크기·시계 ---------- */
// 노트북 화면이 프레임보다 작으면 비율을 유지한 채 축소(잘리거나 바깥 스크롤이 생기지 않게)
function 프레임맞추기() {
  const wrap = document.getElementById('frameWrap'), frame = document.getElementById('frame');
  if (window.innerWidth <= 720) { wrap.style.width = ''; wrap.style.height = ''; frame.style.transform = ''; return; }
  const s = Math.min(1, (window.innerHeight - 32) / 868, (Math.min(window.innerWidth, 1100) - 32 - 384) / 414);
  const sc = Math.max(0.4, s);
  wrap.style.width = 414 * sc + 'px';
  wrap.style.height = 868 * sc + 'px';
  frame.style.transform = `scale(${sc})`;
}
function 시계() {
  const d = new Date();
  const el = document.getElementById('clock');
  if (el) el.textContent = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}
window.addEventListener('resize', () => { 프레임맞추기(); 패널그리기(); });

/* ---------- 시작 ---------- */
(function 시작() {
  try {
    const res = 불러오기();
    state = res.s;
    if (res.fresh) 저장(true);
    프레임맞추기();
    시계();
    // 분이 바뀌는 순간에 맞춰 1분마다 갱신
    setTimeout(() => { 시계(); setInterval(시계, 60000); }, (60 - new Date().getSeconds()) * 1000);
    if (!location.hash) history.replaceState(null, '', state.app.session.role ? '#/' + 영역() + '/ledger' : '#/login');
    라우트적용();
    if (res.error) {
      모달열기(`<h2 id="modal-title">⚠️ 저장 데이터 오류</h2>
        <p>저장 데이터를 불러오지 못해 기본 시연 데이터로 시작합니다.</p>
        <button type="button" class="btn primary block" id="d1-ok" data-act="modalclose">확인</button>`);
      저장(true);
    }
  } catch (e) {
    // 최후의 방어선: 어떤 예외가 나도 흰 화면 대신 안내를 보여 준다
    document.getElementById('appMain').innerHTML = `<div class="center"><h2>⚠️ 화면을 그리지 못했습니다</h2><p>기본 시연 데이터로 다시 시작하려면 아래 버튼을 누르세요.</p>
      <button type="button" class="btn primary" onclick="try{localStorage.removeItem('${CONFIG.storageKey}')}catch(e){};location.hash='';location.reload()">기본 데이터로 다시 시작</button></div>`;
  }
})();
</script>
