<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#C3002F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="QFlowz">
<meta name="description" content="세종대학교 동아리 부원이 총무에게 직접 따져 묻지 않아도 회비 지출 근거를 확인하도록 돕는 결제 근거 카드 시연 앱">
<title>QFlowz - 동아리 회비 지출 근거 확인 서비스</title>
<style>
/* ===== 색·글자 토큰: ■5 수치를 한곳에 모아 다크 모드에서 한 번에 바꾸기 위함 ===== */
:root{
  --bg:#f7f8fa; --card:#ffffff; --text:#202020; --sub:#4A4F55;
  --accent:#C3002F; --accent-soft:#F3E6E9; --on-accent:#ffffff;
  --warn:#f08c00; --danger:#e03131; --ok:#2f9e44; --line:#e3e6ec;
  --mvp:#FFF8E1;
  --ok-soft:#e9f6ec; --warn-soft:#fff4e0; --danger-soft:#fdecec; --muted-soft:#eef0f3;
  --paper:#fffdf6; --frame:#202020;
  --shadow:0 2px 10px rgba(20,24,31,.07);
  --radius:12px; --btn-h:36px; --btn-r:8px;
  --font:-apple-system, BlinkMacSystemFont, "Malgun Gothic", "맑은 고딕", sans-serif;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#15171a; --card:#1f2226; --text:#eceef1; --sub:#b4bac2;
    --accent:#e2335a; --accent-soft:#3a1f27; --on-accent:#ffffff;
    --line:#33373d; --mvp:#3a3220;
    --ok-soft:#1d3324; --warn-soft:#3a2c14; --danger-soft:#3d1d1e; --muted-soft:#2a2e33;
    --paper:#2a2a24; --frame:#000000;
    --shadow:0 2px 10px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.6;
  touch-action:manipulation;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
h1,h2,h3,h4,p{margin:0}
h1{font-size:24px;line-height:1.35}
h2{font-size:20px;line-height:1.4}
h3{font-size:16px;line-height:1.5}
.small,small{font-size:13px}
.sub{color:var(--sub)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* 선 아이콘(SVG): 글자 크기와 글자색을 따라간다 */
.i{width:1.15em;height:1.15em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em}

/* ===== 페이지 틀: 노트북은 안내 패널 + 휴대폰 프레임 ===== */
.page{max-width:1100px;margin:0 auto;padding:16px;height:100%;display:flex;gap:24px;align-items:center;justify-content:center}
.panel{flex:0 0 360px;width:360px;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:12px;padding-right:4px}
.frame-wrap{flex:0 0 auto;position:relative;width:414px;height:868px}
.frame{position:absolute;left:0;top:0;width:414px;height:868px;border:12px solid var(--frame);border-radius:44px;
  background:var(--bg);box-shadow:0 12px 40px rgba(0,0,0,.18);overflow:hidden;transform-origin:0 0}
.notch{position:absolute;top:6px;left:50%;transform:translateX(-50%);width:120px;height:32px;background:#000;border-radius:16px;z-index:30}
.statusbar{position:absolute;top:0;left:0;right:0;height:40px;display:flex;align-items:center;justify-content:space-between;
  padding:0 22px;font-size:13px;font-weight:700;background:var(--card);z-index:20}
.app{position:absolute;top:40px;left:0;right:0;bottom:0;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.app-main{flex:1;display:flex;flex-direction:column;min-height:0}

/* ===== 앱 3단 구조: 헤더 / 스크롤 콘텐츠 / 하단 탭 ===== */
.hdr{flex:none;display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--card);color:var(--text)}
.hdr.treasurer{background:var(--accent);color:var(--on-accent);border-bottom-color:var(--accent)}
.hdr .role{font-weight:800;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .role small{display:block;font-weight:500;opacity:.85;line-height:1.2}
.icon-btn{min-width:36px;height:36px;border-radius:var(--btn-r);border:1px solid var(--line);background:transparent;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;padding:0 8px;font-size:15px}
.hdr.treasurer .icon-btn{border-color:rgba(255,255,255,.55);color:#fff}
.icon-btn[aria-pressed="true"]{background:var(--mvp);border-color:transparent;color:var(--text)}
.content{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding:16px;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
.content.slide-in{animation:slideIn .25s ease-out}
@keyframes slideIn{from{transform:translateX(28px);opacity:.3}to{transform:none;opacity:1}}
.tabbar{flex:none;display:flex;overflow-x:auto;background:var(--card);border-top:1px solid var(--line);scrollbar-width:none;
  padding-bottom:env(safe-area-inset-bottom)}
.tabbar::-webkit-scrollbar{display:none}
.tab{flex:1 0 55px;min-width:55px;min-height:58px;border:0;background:transparent;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:0;font-size:12px;white-space:nowrap;color:var(--sub);padding:4px 2px;border-top:3px solid transparent}
.tab .ic{font-size:19px;line-height:1}
.tab[aria-current="page"]{color:var(--accent);font-weight:800;border-top-color:var(--accent)}
/* 거래 단계 띠: 결제 근거 → 모의 대조 → 익명 확인 → 최종 상태. 하단 탭에는 없고 이 화면들에서만 위에 나타난다 */
.stepbar{flex:none;display:flex;background:var(--card);border-bottom:1px solid var(--line)}
.step{flex:1 1 0;min-width:0;height:46px;border:0;border-bottom:3px solid transparent;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;
  font-size:13px;white-space:nowrap;color:var(--sub);padding:0 2px}
.step .n{flex:none;width:18px;height:18px;border-radius:50%;border:1px solid currentColor;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;line-height:1}
.step[aria-current="step"]{color:var(--accent);font-weight:800;border-bottom-color:var(--accent)}
.step[aria-current="step"] .n{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.step:active{transform:scale(.97)}
@media (max-width:350px){.step .n{display:none}}

/* ===== 카드·버튼 공통 ===== */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;min-width:0}
.card h3{margin-bottom:6px}
.stack{display:flex;flex-direction:column;gap:8px}
/* 스크롤 영역(.content) 안의 블록은 줄어들지 않게: 가로 스크롤 칩 줄(.chips)이 높이 0으로 눌려 다음 카드에 덮이던 문제 수정 */
.content>*,.stack>*{flex-shrink:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{height:var(--btn-h);min-height:var(--btn-h);border-radius:var(--btn-r);border:1px solid var(--line);background:var(--card);
  padding:0 14px;cursor:pointer;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  transition:transform .08s;white-space:nowrap;max-width:100%}
.btn:active,.tab:active,.chip:active,.txcard:active,.rolecard:active,.icon-btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.btn.tall{height:44px}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.next{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.chip{flex:none;height:32px;border-radius:16px;border:1px solid var(--line);background:var(--card);padding:0 12px;cursor:pointer;font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.chips.wrap{flex-wrap:wrap;overflow-x:visible}
.chips.wrap .chip{height:40px;padding:0 14px}
.pgroup{display:flex;flex-direction:column;gap:6px}
.pgroup .lb{font-size:13px;font-weight:700;color:var(--sub)}
.pgroup .err{color:var(--danger);font-size:13px}
.opt{position:relative;display:inline-flex}
.opt input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.opt span{display:inline-flex;align-items:center;height:40px;padding:0 14px;border:1px solid var(--line);border-radius:20px;background:var(--card);font-size:13px;white-space:nowrap}
.opt input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.opt input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.pgroup.invalid .opt span{border-color:var(--danger)}
/* 샘플 설문(혜택 탭): 보기가 긴 문장이라 알약 대신 한 줄짜리 선택 상자로 보여 준다 */
.sbody>*{flex-shrink:0}
.sq{border:0;padding:0;margin:0;min-width:0;display:flex;flex-direction:column;gap:8px}
.sq legend{padding:0;margin-bottom:8px;font-size:15px;font-weight:700;line-height:1.5}
.sopts{display:flex;flex-direction:column;gap:6px}
.sopt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:14px;line-height:1.45;cursor:pointer}
.sopt input{width:20px;height:20px;margin:1px 0 0;flex:none;accent-color:var(--accent)}
.sopt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.sopt:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
.sq.invalid .sopt,.sq.invalid textarea{border-color:var(--danger)}
.sq .err{color:var(--danger);font-size:13px}
.sq textarea{width:100%;max-width:100%;min-height:96px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--card);font-size:16px;resize:vertical}
#sv-top:focus{outline:none}
.modal.scroll{max-height:calc(100% - 24px);overflow-y:auto}
.notice{font-size:13px;color:var(--sub);background:var(--muted-soft);border-radius:8px;padding:8px 10px}
.notice.strong{background:var(--warn-soft);color:var(--text)}
.foot{text-align:center;margin:0}
.linkbtn{background:none;border:0;padding:6px 8px;font-size:13px;color:var(--sub);text-decoration:underline;cursor:pointer}
.stats-strip{flex:none;display:flex;flex-direction:column;gap:6px;padding:8px 12px;font-size:13px;color:var(--text);background:var(--muted-soft);border-bottom:1px solid var(--line)}
.stats-strip[hidden]{display:none}
.stats-strip .btn{height:30px;min-height:30px;padding:0 10px;font-size:13px}
.title-row{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.kv{display:grid;grid-template-columns:96px 1fr;gap:4px 10px;font-size:15px}
.kv dt{color:var(--sub);font-size:13px;padding-top:2px}
.kv dd{margin:0;word-break:keep-all;overflow-wrap:anywhere}
.amount{font-size:24px;font-weight:800;letter-spacing:-.3px}
.empty{text-align:center;padding:28px 12px}
.empty .big{font-size:40px;color:var(--sub)}

/* ===== 상태 배지: 색 + 글자 + 아이콘을 함께 써서 색맹 사용자도 구분 ===== */
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:13px;font-weight:700;white-space:nowrap}
.b-match{color:var(--ok);background:var(--ok-soft)}
.b-mismatch{color:var(--danger);background:var(--danger-soft)}
.b-need{color:#b36200;background:var(--warn-soft)}
.b-pending{color:var(--sub);background:var(--muted-soft)}
.b-done{color:var(--ok);background:var(--ok-soft)}
.b-explain{color:#b36200;background:var(--warn-soft)}
.b-wait{color:var(--sub);background:var(--muted-soft)}
@media (prefers-color-scheme: dark){.b-need,.b-explain,.tx-warn{color:#ffb84d}}

/* ===== 거래 카드 / 영수증 카드 / 대조 결과 카드를 서로 다르게 보이게 ===== */
.txcard{width:100%;text-align:left;cursor:pointer;display:block;background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius);padding:12px;box-shadow:var(--shadow)}
.txcard[aria-pressed="true"]{background:var(--accent-soft);border-color:transparent}
.txcard .top{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--sub)}
.txcard .mid{display:flex;justify-content:space-between;gap:8px;align-items:center;margin:2px 0}
.txcard .item{font-weight:800}
.txcard .won{font-weight:800;white-space:nowrap}
.txcard .why{font-size:13px;color:var(--sub);display:block}
.sec-tx .head,.sec-rc .head,.sec-res .head{font-size:13px;font-weight:800;letter-spacing:.2px;margin-bottom:8px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.sec-tx .head{color:var(--accent)}
.sec-rc{background:var(--paper);border:2px dashed var(--line);box-shadow:none}
.receipt{font-family:ui-monospace,"Courier New",monospace;font-size:13px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px 12px;line-height:1.5}
.receipt .rhead{text-align:center;font-weight:800;border-bottom:1px dashed var(--line);padding-bottom:6px;margin-bottom:6px}
.receipt .rl{display:flex;justify-content:space-between;gap:8px}
.receipt .rtotal{border-top:1px dashed var(--line);margin-top:6px;padding-top:6px;font-weight:800}
.sec-res{border-color:transparent}
.sec-res.r-match{background:var(--ok-soft)}
.sec-res.r-mismatch{background:var(--danger-soft)}
.sec-res.r-need{background:var(--warn-soft)}
.sec-res.r-pending{background:var(--muted-soft)}
.cmp{width:100%;border-collapse:collapse;font-size:14px;table-layout:fixed}
.cmp th,.cmp td{border:1px solid var(--line);padding:6px 6px;text-align:left;vertical-align:top;overflow-wrap:anywhere}
.cmp thead th{background:var(--muted-soft);font-size:13px}
.cmp th[scope=row]{width:64px;font-size:13px;color:var(--sub);font-weight:600}
.cmp td.mark{width:34px;text-align:center}
.mk.ok{color:var(--ok)} .mk.bad{color:var(--danger)} .mk.wait{color:var(--sub)}

/* ===== 익명 확인·최종 상태 ===== */
.vote-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vote-btns .btn{height:44px;white-space:normal;line-height:1.2}
.vote-btns .btn[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.bar{height:12px;border-radius:6px;background:var(--muted-soft);overflow:hidden;display:flex}
.bar .ok{background:var(--ok)} .bar .ask{background:var(--warn)}
.stat-big{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800}
.stat-big .ic{font-size:30px;display:inline-flex;color:var(--sub)}
.s-done .stat-big .ic{color:var(--ok)} .s-explain .stat-big .ic{color:var(--warn)}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.metric{background:var(--muted-soft);border-radius:8px;padding:8px 10px}
.metric b{display:block;font-size:20px}
.metric span{font-size:13px;color:var(--sub)}
.status-card.s-done{border:2px solid var(--ok)}
.status-card.s-explain{border:2px solid var(--warn)}

/* ===== Q&A ===== */
.qa{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;background:var(--card)}
.qa .q{font-weight:700}
.qa .a{background:var(--muted-soft);border-radius:8px;padding:8px;font-size:15px}
.qa .meta{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:13px;color:var(--sub);flex-wrap:wrap}

/* ===== 혜택 탭·광고 띠: 결제 근거 카드와 헷갈리지 않게 '광고' 표시를 붙인다 ===== */
.perk{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--card)}
.perk .info{flex:1;min-width:0}
.perk .val{display:block;font-weight:800;color:var(--accent);font-size:14px}
.perk .meta{display:block;font-size:13px;color:var(--sub)}
.perklead{font-size:17px;font-weight:800;line-height:1.45;margin:2px 0}
.wallet{background:var(--muted-soft);border-radius:8px;padding:10px}
.adband{display:flex;flex-direction:column;gap:6px;font-size:13px}
.adband .adhead{display:flex;align-items:center;gap:8px;min-width:0}
.adband .adtag{flex:none;font-size:12px;font-weight:800;border:1px solid var(--sub);border-radius:4px;padding:0 6px;color:var(--sub)}
.adband .addots{margin-left:auto;display:flex;gap:4px;flex:none}
.adband .addots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.adband .addots i.on{background:var(--sub)}
/* 배너마다 자기 카드(테두리·모서리)를 갖고, 카드째로 옆으로 밀려 나간다. 띠를 화면 좌우 여백(.content의 16px)만큼 넓게 그려 옆 카드가 화면 끝까지 보이며 지나가게 한다 */
.adtrack{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -16px}
.adtrack::-webkit-scrollbar{display:none}
.adslide{flex:0 0 100%;scroll-snap-align:center;padding:0 16px;border:0;background:none;cursor:pointer;display:block}
.adcard{display:block;aspect-ratio:3.2/1;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--muted-soft)}
.adcard img{width:100%;height:100%;object-fit:cover;display:block;-webkit-user-drag:none}
.adslide:focus-visible{outline:none}
.adslide:focus-visible .adcard{outline:2px solid var(--accent);outline-offset:-2px}
/* 공유 카드: 보낼 글과 링크를 그대로 보여 줘, 복사가 막힌 브라우저에서도 길게 눌러 복사할 수 있게 한다 */
.sharebox{margin:0;padding:8px 10px;border:1px dashed var(--line);border-radius:8px;background:var(--muted-soft);font-size:13px;line-height:1.5;overflow-wrap:anywhere;-webkit-user-select:text;user-select:text}
.sharebox .url{display:block;color:var(--sub)}

/* ===== 개인화(과업 ④): 총무 할 일 / 부원 내 차례 / 확인 재알림 ===== */
.todo{display:flex;flex-direction:column;gap:6px}
.todo-row{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;min-height:44px;text-align:left;cursor:pointer;
  border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);padding:6px 10px;font:inherit}
.todo-row:active{transform:scale(.99)}
.mine-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.nudge{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:var(--radius);
  background:var(--card);box-shadow:var(--shadow);padding:12px}
.nudge p{margin:0}
details.card>summary{cursor:pointer}

/* ===== 입력 폼 ===== */
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;font-weight:700;color:var(--sub)}
.field input,.field select,.field textarea{width:100%;min-height:40px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--card);font-size:16px}
.field textarea{min-height:72px;resize:vertical}
.field .err{color:var(--danger);font-size:13px;min-height:0}
.field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--danger)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.grid2>*{min-width:0}
.grid2 .btn{height:auto;white-space:normal;line-height:1.25;padding:6px 10px;text-align:center}
.field input,.field select,.field textarea{max-width:100%}
.hint{font-size:13px;color:var(--sub)}

/* ===== MVP 설명 모드 ===== */
.mvp-card{background:var(--mvp);border-radius:var(--radius);padding:12px;font-size:14px}
.mvp-card .tag{display:inline-block;font-size:13px;font-weight:800;background:var(--card);border-radius:999px;padding:0 8px;margin:0 4px 4px 0}
.mvp-card .row{margin-top:8px}
.mvp-card .btn{height:32px;font-size:13px}

/* ===== 로그인·PIN·권한 없음 ===== */
.center{display:flex;flex-direction:column;gap:14px;padding:24px 18px;flex:1;overflow-y:auto}
.logo{width:64px;height:64px;border-radius:18px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:32px;margin:8px auto 0}
.brand{text-align:center}
.brand h1{color:var(--accent)}
.rolecards{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.rolecard{display:flex;gap:12px;align-items:flex-start;border:2px solid var(--line);border-radius:var(--radius);padding:12px;background:var(--card);cursor:pointer}
.rolecard input{width:20px;height:20px;margin-top:4px;accent-color:var(--accent)}
.rolecard:has(input:checked){border-color:transparent;background:var(--accent-soft)}
.rolecard b{display:block}
.pin-input{letter-spacing:12px;text-align:center;font-size:24px!important}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* ===== 바텀시트·모달 ===== */
.sheet-layer,.modal-layer{position:absolute;inset:0;z-index:50}
.sheet-layer[hidden],.modal-layer[hidden]{display:none}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.42);opacity:0;transition:opacity .25s}
.sheet-layer.open .backdrop,.modal-layer.open .backdrop{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;background:var(--card);border-radius:18px 18px 0 0;display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .25s ease-out;padding-bottom:env(safe-area-inset-bottom)}
.sheet-layer.open .sheet{transform:translateY(0)}
.sheet .grab{padding:8px 0 2px;display:flex;justify-content:center;cursor:grab;touch-action:none}
.sheet .grab span{width:44px;height:5px;border-radius:3px;background:var(--line)}
.sheet .shead{display:flex;align-items:center;justify-content:space-between;padding:4px 16px 8px;gap:8px;touch-action:none}
.sheet .sbody{overflow-y:auto;padding:0 16px 18px;display:flex;flex-direction:column;gap:10px;overscroll-behavior:contain}
.modal{position:absolute;left:20px;right:20px;top:50%;transform:translateY(-50%) scale(.96);opacity:0;transition:.2s;background:var(--card);border-radius:14px;padding:18px;
  display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.modal-layer.open .modal{opacity:1;transform:translateY(-50%) scale(1)}
.toast{position:absolute;right:12px;bottom:76px;z-index:60;background:#202020;color:#fff;font-size:13px;padding:6px 12px;border-radius:999px;
  opacity:0;transform:translateY(6px);transition:.2s;pointer-events:none}
.toast.show{opacity:1;transform:none}
.loglist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.loglist li{font-size:13px;border-bottom:1px solid var(--line);padding:6px 0;display:grid;grid-template-columns:110px 1fr;gap:6px}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.check input{width:20px;height:20px;margin-top:3px;flex:none;accent-color:var(--accent)}
.check small{display:block;color:var(--sub)}
.check small.err{color:var(--danger)}
.ue{width:100%;border-collapse:collapse;font-size:13px}
.ue th,.ue td{border:1px solid var(--line);padding:6px;text-align:left;vertical-align:top}
.ue th{background:var(--muted-soft)}
.journey{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.journey li{font-size:13px;padding:4px 8px;border-radius:6px;background:var(--muted-soft)}
.journey li.low{background:var(--danger-soft);font-weight:700}

/* ===== 노트북 안내 패널 ===== */
.panel .card{padding:14px}
.panel .brandline{display:flex;gap:10px;align-items:center}
.panel .brandline .logo{width:44px;height:44px;font-size:22px;margin:0;border-radius:12px}
.cp{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.cp button{width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 10px;cursor:pointer;font-size:14px}
.cp button b{color:var(--accent)}

/* ===== 사용자 테스트 피드백 반영(2026-11-07): 읽기 쉬운 글 · 접힌 거래 목록 · Q&A 알림 · 공유 버튼 ===== */
/* 단어 중간에서 줄이 바뀌지 않게 하고, 읽는 글자는 14px 이상으로(13px은 배지·통계 띠에만 남긴다) */
body{word-break:keep-all;overflow-wrap:anywhere}
.small,small,.notice,.hint,.kv dt,.metric span,.qa .meta,.field label,.pgroup .lb,.linkbtn{font-size:14px}
.notice{line-height:1.55}
.hdr .role small{font-size:12px}
.chip{font-size:14px;height:36px}
h2{font-size:22px}
.card{padding:16px}
.content{gap:14px}
.chev{transform:rotate(90deg);transition:transform .15s}
/* 알림 숫자: 헤더 종 아이콘·하단 탭 */
.icon-btn{position:relative}
.nbadge{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--danger);color:#fff;
  border:2px solid var(--card);font-size:11px;font-weight:800;line-height:16px;text-align:center}
.hdr.treasurer .nbadge{background:#fff;color:var(--accent);border-color:var(--accent)}
.tab{position:relative}
.tab .nbadge{top:4px;right:auto;left:calc(50% + 4px)}
/* 거래 내역: 요약 카드 + 달별로 묶은 접힌 목록(한 줄 요약 → 누르면 그 자리에서 펼침) */
.sum{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:baseline;column-gap:10px}
.sum .lbl{font-size:14px;color:var(--sub)}
.sum .total{font-size:24px;font-weight:800;letter-spacing:-.4px;line-height:1.3}
.sum .line{grid-column:1 / -1;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;padding-top:10px;border-top:1px solid var(--line);font-size:14px;color:var(--sub)}
.sum .line .btn{height:36px;min-height:36px;flex:none}
.mhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:0 4px;margin-bottom:-6px}
.mhead b{font-size:16px}
.mhead span{font-size:14px;color:var(--sub)}
.txlist{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.txrow+.txrow{border-top:1px solid var(--line)}
.txrow.open{background:var(--accent-soft)}
.txhead{width:100%;min-height:56px;display:grid;grid-template-columns:minmax(0,1fr) auto 18px;column-gap:10px;row-gap:2px;align-items:center;
  padding:7px 12px 7px 16px;border:0;background:transparent;color:inherit;font:inherit;text-align:left;cursor:pointer;line-height:1.45}
.txhead .t{grid-column:1;grid-row:1;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txhead .won{grid-column:2;grid-row:1;font-weight:800;white-space:nowrap;text-align:right}
.txhead .m{grid-column:1;grid-row:2;font-size:14px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txhead .badge{grid-column:2;grid-row:2;justify-self:end;line-height:1.4}
.txhead .chev{grid-column:3;grid-row:1 / span 2;color:var(--sub)}
.txrow.open .chev,.fold[open]>summary .chev{transform:rotate(-90deg)}
.txhead:active{transform:scale(.99)}
.udot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin:0 6px 2px 0;vertical-align:middle}
.txbody{padding:0 16px 14px;display:flex;flex-direction:column;gap:12px}
.txbody .kv{grid-template-columns:76px minmax(0,1fr);font-size:15px}
.txbody .grid2 .btn{height:44px}
.tx-bad{color:var(--danger)} .tx-warn{color:#b36200} .tx-ok{color:var(--ok)}
/* 결제 근거: 결론 한 줄을 맨 위에, 덜 급한 칸은 접기 */
.hero{display:flex;flex-direction:column;gap:2px}
.hero .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.verdict{display:flex;gap:10px;align-items:flex-start;margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--muted-soft)}
.verdict>.i{font-size:20px;margin-top:2px;color:var(--sub)}
.verdict.v-match{background:var(--ok-soft)} .verdict.v-match>.i{color:var(--ok)}
.verdict.v-mismatch{background:var(--danger-soft)} .verdict.v-mismatch>.i{color:var(--danger)}
.verdict.v-need{background:var(--warn-soft)} .verdict.v-need>.i{color:var(--warn)}
.verdict>div{min-width:0;flex:1}
.verdict b{display:block;font-size:16px}
.verdict .vs{display:block;font-size:14px;color:var(--sub)}
.verdict .btn{margin-top:8px}
.shead2{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.shead2 h3{margin:0}
.fold{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.fold>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:52px;padding:0 14px 0 16px;cursor:pointer;font-weight:700}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary .r{display:inline-flex;align-items:center;gap:6px;font-weight:400;font-size:14px;color:var(--sub);text-align:right}
.fold .fbody{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
.bar{position:relative}
.bar .th{position:absolute;top:0;bottom:0;left:15%;width:2px;background:var(--text);opacity:.55}
/* 알림 목록(바텀시트) */
.noti{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:start;width:100%;text-align:left;padding:12px;
  border:1px solid var(--line);border-radius:12px;background:var(--card);color:inherit;font:inherit;cursor:pointer}
.noti.new{background:var(--accent-soft);border-color:transparent}
.noti .nic{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--muted-soft);color:var(--sub)}
.noti.new .nic{background:var(--card);color:var(--accent)}
.noti .nt{display:flex;flex-direction:column;gap:2px;min-width:0}
.noti .nt b{font-size:15px}
.noti .nt .s{font-size:14px;color:var(--sub)}
.noti .nt .qt{font-size:14px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.noti .when{font-size:13px;color:var(--sub);white-space:nowrap}
.noti:active{transform:scale(.99)}
/* 공개 Q&A: 방금 답이 달린 내 질문 · 알림으로 연 질문 */
.qa.fresh{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.qa .mine{font-weight:700;color:var(--accent)}
/* 총무 관리: 할 일 순서 */
.qrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.qrow>div{min-width:0}
.qrow b{display:block}
.qrow .btn{flex:none;height:40px}
.qprev{font-size:15px;background:var(--muted-soft);border-radius:8px;padding:8px 10px}
/* 공유: 접지 않고 한 번에 누르는 눈에 띄는 버튼 */
.btn.share{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.sharecard .linkbtn{align-self:center}

/* ===== 휴대폰(720px 이하): 프레임·패널을 숨기고 앱이 화면 전체를 채움 ===== */
@media (max-width:720px){
  .page{padding:0;display:block;height:100dvh}
  .panel,.notch,.statusbar{display:none}
  .frame-wrap{width:100%!important;height:100dvh!important}
  .frame{position:static;width:100%!important;height:100dvh!important;border:0;border-radius:0;box-shadow:none;transform:none!important}
  .app{position:absolute;inset:0;padding-top:env(safe-area-inset-top);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
  .frame-wrap{position:relative}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

    tx.result = t.mockResult ? { code: t.mockResult, detail: 규칙대조(tx).detail, at: t.date + 'T' + t.time } : null;

      // 참석한 행사는 저장하지 않는다: A/B 그룹 a는 CONFIG.ab.roster(가상 참석 명단)로 정해지고, 그룹 b에는 없다
      firstOpenAt: new Date().toISOString(),   // 시드 거래의 7일 확인 기간을 세는 시작점(처음 연 시각)
      clockSkewMs: 0,                          // 시연용 시계: 재알림 계산에만 더한다
      nudge: { off: false, viewed: {}, done: {} },  // 재알림 끄기 / 화면에 보인 거래 / 닫거나 눌러서 끝난 거래

      noti: { off: false, seen: {}, viewed: {} } // 알림 끄기 / 알림 목록을 열어 읽은 것 / 종 숫자로 보여 준 것(noti_view를 한 번만 센다)

let state = 기본상태만들기();

/* =====================================================================
   3. 저장 / 복원: 실패해도 흰 화면이 되지 않도록 모두 try/catch
   ===================================================================== */
let 토스트타이머 = null, 저장타이머 = null;
function 토스트(msg) {
  const el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(토스트타이머);
  토스트타이머 = setTimeout(() => el.classList.remove('show'), 1500);
}
function 저장(조용히) {
  try {
    state.app.lastSaved = new Date().toISOString();
    // '__'로 시작하는 값은 화면 임시 상태(오류 문구 등)라 저장하지 않는다
    localStorage.setItem(CONFIG.storageKey, JSON.stringify(state, (k, v) => (k.startsWith('__') ? undefined : v)));
    if (!조용히) 토스트('저장했어요');
    return true;
  } catch (e) {
    토스트('저장하지 못했어요. 이 탭을 닫으면 입력한 내용이 사라져요');
    return false;
  }
}
// 글자 입력처럼 잦은 변경은 0.4초 모아서 저장(매 글자마다 쓰기 방지)
function 지연저장() { clearTimeout(저장타이머); 저장타이머 = setTimeout(() => 저장(), 400); }

function 불러오기() {
  let raw = null;
  try { raw = localStorage.getItem(CONFIG.storageKey); }
  catch (e) { return { s: 기본상태만들기(), error: true }; }
  if (!raw) return { s: 기본상태만들기(), error: false, fresh: true };
  try {
    const s = JSON.parse(raw);
    if (!s || s.version !== 2 || !s.app || !Array.isArray(s.app.txs)) throw new Error('형식 불일치');
    // 규칙(이의 비율 분모·계좌 CSV 흐름)이 바뀌기 전 저장본은 섞이지 않게 기본 데이터로 새로 시작
    if (s.app.dataVer !== 3) return { s: 기본상태만들기(), error: false, fresh: true };
    return { s: 보정(s), error: false };
  } catch (e) {
    return { s: 기본상태만들기(), error: true };
  }
}
// 예전 버전 저장본에 없는 칸을 기본값으로 채워 렌더 중 undefined 오류를 막는다
function 보정(s) {
  const d = 기본상태만들기();
  for (const k of Object.keys(d)) if (s[k] === undefined) s[k] = d[k];
  for (const k of Object.keys(d.app)) if (s.app[k] === undefined || s.app[k] === null && k !== 'selectedTx' && k !== 'lastSaved') s.app[k] = d.app[k];
  if (!s.app.session || typeof s.app.session !== 'object') s.app.session = d.app.session;
  s.app.filters = Object.assign({}, d.app.filters, s.app.filters);
  return s;
}
function 로그(action, tx) {
  const role = state.app.session.role === 'treasurer' ? '총무' : state.app.session.role === 'member' ? '부원' : '방문자';
  state.app.logs.push({ t: new Date().toISOString(), role, action, tx: tx || '' });
}

/* =====================================================================
   4. 도메인 규칙: 대조·판정 계산 (화면과 분리해 규칙을 한곳에서 설명)
   ===================================================================== */
// 규칙 기반 모의 비교: 실제 OCR·은행 연동이 아니라 입력된 가상 값끼리 비교만 한다
function 규칙대조(tx) {
  const 부족 = [];
  if (!tx.receiptNo) 부족.push('영수증 번호');
  if (!tx.receiptDate) 부족.push('영수증 날짜');
  if (!(Number(tx.receiptAmount) > 0)) 부족.push('영수증 금액');
  if (!tx.reason || !tx.reason.trim()) 부족.push('지출 사유');
  if (부족.length) return { code: 'need', detail: 부족.join('·') + ' 정보가 없어 비교할 수 없어요(판독 불가).' };
  if (Number(tx.amount) !== Number(tx.receiptAmount)) {
    const diff = Math.abs(tx.amount - tx.receiptAmount);
    return { code: 'mismatch', detail: `거래 금액 ${원(tx.amount)}과 영수증 금액 ${원(tx.receiptAmount)}이 ${원(diff)} 달라요.` };
  }
  if (tx.date !== tx.receiptDate) return { code: 'need', detail: `금액은 같지만 거래일(${tx.date})과 영수증 날짜(${tx.receiptDate})가 달라요.` };
  return { code: 'match', detail: '거래 금액과 날짜가 영수증과 모두 같아요.' };
}
function 결과코드(tx) { return tx && tx.result ? tx.result.code : 'pending'; }
// 집계 = 가상 기본 집계 + 이 브라우저에서 내가 고른 응답(1표). 개인 식별 정보는 없다
function 집계(txId) {
  const base = state.app.votes[txId] || { ok: 0, ask: 0 };
  const mine = state.app.myVotes[txId];
  const ok = base.ok + (mine === 'ok' ? 1 : 0);
  const ask = base.ask + (mine === 'ask' ? 1 : 0);
  const total = ok + ask;
  // 무응답 = 이의 없음(기본값 넛지)이므로 분모는 응답자가 아니라 행사 참여 부원 전체
  const ratio = CONFIG.rules.members ? ask / CONFIG.rules.members : 0;
  const nores = Math.max(0, CONFIG.rules.members - total);
  return { ok, ask, total, ratio, nores, code: ratio >= CONFIG.rules.threshold ? 'explain' : 'done' };
}
// 확인 기간은 '총무가 근거를 올린 때부터 7일'이다. 시드 거래는 근거가 이미 붙어 있으므로 처음 연 시각(firstOpenAt)부터 센다
function 확인시작(tx) {
  const t = new Date(tx.reasonAt || state.app.firstOpenAt).getTime();
  return isNaN(t) ? Date.now() : t;
}
function 확인마감(tx) { return 확인시작(tx) + CONFIG.rules.periodDays * 86400000; }
function 확인기간(tx) {
  return { start: 날짜표시(new Date(확인시작(tx))), end: 날짜표시(new Date(확인마감(tx))) };
}

/* ---------- 개인화(과업 ④): 역할·참석 행사·내 응답 이력을 쓰는 규칙 기반. 학습형 추천이 아니다 ---------- */
function 지금() { return Date.now() + (Number(state.app.clockSkewMs) || 0); }   // 시연용 시계(설정에서 마감 하루 전으로 옮길 수 있다)
function 행사인가(tx) { return !!(tx.event || tx.category === '행사'); }
// 참석한 행사: 개인화 그룹(a)만 시연용 참석 명단으로 정해진다. 그룹 b에는 개인화가 없어 '내 차례'도, 참석 행사만 고르는 재알림도 없다
function 참석정함() { return 개인화그룹() === 'a' && CONFIG.ab.roster.length > 0; }
function 내차례인가(tx) { return 참석정함() && CONFIG.ab.roster.includes(tx.id); }
function 내확인대기(tx) { return !!tx.reason && !state.app.myVotes[tx.id]; }   // 근거는 올라왔는데 내가 아직 응답하지 않은 거래
// 총무 할 일: 근거 대기 · 불일치 · 설명 필요(이의 비율 기준 초과) · 미답변 질문
function 할일(tx) {
  const 목록 = [];
  if (!tx.reason) 목록.push('wait');
  else {
    if (결과코드(tx) === 'mismatch') 목록.push('mismatch');
    if (집계(tx.id).code === 'explain') 목록.push('explain');
  }
  if (state.app.qna.some(q => q.txId === tx.id && !q.a)) 목록.push('qna');
  return 목록;
}
// 확인 재알림 대상: 부원이 켜 두었고, 내가 응답하지 않았고(그룹 a는 참석 명단의 행사만), 마감이 24시간 안으로 남았고, 아직 닫거나 누르지 않은 거래.
// 마감이 가까운 순, 같으면 화면 목록과 같은 최신순. 예전의 거래 번호순은 그룹 b의 일반 알림까지 우연히 참석 행사(TX-001)로 데려가 두 그룹의 차이를 줄였다
function 재알림대상들() {
  if (역할() !== 'member' || state.app.nudge.off) return [];
  const 한계 = CONFIG.nudge.dueHours * 3600000, 기준 = 지금();
  return state.app.txs
    .filter(t => 내확인대기(t) && (!참석정함() || 내차례인가(t)) && !state.app.nudge.done[t.id] && 확인마감(t) - 기준 > 0 && 확인마감(t) - 기준 <= 한계)
    .sort((a, b) => 확인마감(a) - 확인마감(b) || 최신비교(a, b));
}
function 재알림끝내기() {
  const 시각 = new Date().toISOString();
  재알림대상들().forEach(t => { state.app.nudge.done[t.id] = 시각; });
}

/* ---------- Q&A 알림(2026-11-07 사용자 테스트 피드백 "Q&A가 들어오면 알림이 왔으면") ----------
   서버가 없는 시연이라 같은 브라우저 안에서 역할을 바꿔 가며 보인다: 총무에게는 새 질문, 부원에게는 이 브라우저에서 남긴 내 질문의 답변.
   종 아이콘과 공개 Q&A 탭에 숫자로 보이고, 종을 누르면 목록이 열린다. 휴대폰 알림 권한은 요청하지 않는다(다크패턴 점검 a4). 실서비스는 휴대폰 알림으로 보낸다.
   통계: noti_view(종 숫자로 처음 보여 준 알림, target=question/answer) → ui_click act=noti(종을 누름) → noti_click(알림 한 줄을 누름) */
function 알림목록() {
  const r = 역할(), 본 = state.app.noti.seen;
  if (r === 'treasurer') return state.app.qna.slice().reverse().map(q => ({ key: 'q:' + q.id, kind: 'question', q, 끝: !!q.a, 새: !q.a && !본['q:' + q.id] }));
  if (r === 'member') return state.app.qna.filter(q => state.app.myQs[q.id] && q.a).sort((a, b) => String(b.aAt).localeCompare(String(a.aAt)))
    .map(q => ({ key: 'a:' + q.id, kind: 'answer', q, 끝: true, 새: !본['a:' + q.id] }));

/* ---------- 직접 수집(구글 시트) ----------
   GA와 같은 이벤트를 팀의 구글 시트(Apps Script 웹앱)에도 한 행씩 보낸다. 방문자 코드는 무작위로 만든 값이고, 이름은 참여 정보를 입력할 때 profile 행에만 실어 한 번 보낸다.

   보내는 방식(여러 명이 동시에 써도 기록이 빠지지 않게):

   - 화면을 닫아 답을 못 받은 묶음은 다음에 열 때 다시 보낸다. 수집기가 같은 이름표의 묶음은 한 번만 쓰므로 두 번 쌓이지 않는다. */

function 무작위코드() {

function 자체시작() {
  try {

    if (!방문자) { 방문자 = 무작위코드(); localStorage.setItem(방문자키, 방문자); }

  if (보낼묶음.length) 재시도타이머 = setTimeout(() => { 재시도타이머 = 0; 다음전송(); }, 1000 + Math.random() * 3000);

// 보관함은 탭(방문)마다 따로 둔다. 다른 탭의 보관함이 2분 넘게 그대로면 그 탭은 닫힌 것으로 보고 넘겨받는다

    for (const k of 키들) {

      if (v && Array.isArray(v.b)) v.b.forEach(b => { if (b && b.bid && Array.isArray(b.rows) && !보낼묶음.some(x => x.bid === b.bid)) 보낼묶음.push(b); });

function 통계클릭(t) {

  // 재알림을 눌러 근거를 연 것(nudgego)은 nudge_click 으로 따로 남기므로 여기서 ui_click 으로 또 세지 않는다

   6. 라우팅: URL 해시로 화면·시트·선택 거래를 기록 (뒤로 가기·새로고침 대응)
   ===================================================================== */
function 해시해석() {
  const h = (location.hash || '').replace(/^#\/?/, '');
  const [path, qs] = h.split('?');
  const parts = (path || '').split('/').filter(Boolean);
  const q = new URLSearchParams(qs || '');
  return { area: parts[0] || '', page: parts[1] || '', tx: q.get('tx') || '', sheet: q.get('sheet') || '' };
}
function 해시만들기(r) {
  const q = new URLSearchParams();
  if (r.tx) q.set('tx', r.tx);
  if (r.sheet) q.set('sheet', r.sheet);
  const qs = q.toString() ? '?' + q.toString() : '';
  if (r.area === 'm' || r.area === 't') return `#/${r.area}/${r.page || 'ledger'}${qs}`;
  return `#/${r.area || 'login'}${qs}`;
}
let 현재 = { area: 'login', page: '', tx: '', sheet: '' };
function 이동(r, opt) {
  const h = 해시만들기(r);
  try {
    if (opt && opt.replace) history.replaceState(opt.state || null, '', h);
    else history.pushState(opt && opt.state || null, '', h);
  } catch (e) { location.hash = h; return; }
  라우트적용();
}
function 영역() { return 역할() === 'treasurer' ? 't' : 'm'; }
function 탭이동(page) { 이동({ area: 영역(), page, tx: state.app.selectedTx || '' }); }

// 권한 검사: 로그인 전이면 로그인, 부원이 총무 영역에 오면 권한 없음, PIN을 거치지 않은 총무는 PIN 화면으로
function 라우트적용() {
  let r = 해시해석();
  const s = state.app.session;
  const 교체 = nr => { history.replaceState(null, '', 해시만들기(nr)); r = nr; };
  if (대기선택tx) { r.tx = 대기선택tx; 대기선택tx = null; history.replaceState(null, '', 해시만들기(r)); }

  if (r.area === 'm' || r.area === 't' || r.area === 'denied') {
    if (!s.role) 교체({ area: 'login' });
    else if (s.role === 'treasurer' && !s.pinOk) 교체({ area: 'pin' });
    else if (s.role === 'member' && r.area === 't') { 로그('총무 전용 화면 접근 차단'); 저장(true); 교체({ area: 'denied' }); }
    else if (s.role === 'member' && r.area === 'm' && r.page === 'admin') { 로그('총무 전용 화면 접근 차단'); 저장(true); 교체({ area: 'denied' }); }
    else if (s.role === 'treasurer' && (r.area === 'm' || r.area === 'denied')) 교체({ area: 't', page: r.area === 'm' ? r.page : 'ledger', tx: r.tx, sheet: r.sheet });
  } else if (r.area === 'pin') {
    if (s.pending !== 'treasurer') 교체({ area: s.role ? (s.role === 'treasurer' ? 't' : 'm') : 'login', page: 'ledger' });
  } else if (r.area !== 'login') {
    교체(s.role && (s.role === 'member' || s.pinOk) ? { area: 영역(), page: 'ledger', tx: state.app.selectedTx || '' } : { area: 'login' });
  }
  const 페이지목록 = CONFIG.tabs.map(t => t.page);
  if ((r.area === 'm' || r.area === 't') && !페이지목록.includes(r.page)) 교체(Object.assign({}, r, { page: 'ledger' }));
  // 해시의 거래 ID가 실제로 있으면 선택 거래로 반영(새로고침·링크 공유 대응)
  if (r.tx && 찾기(r.tx) && r.tx !== state.app.selectedTx) { state.app.selectedTx = r.tx; 저장(true); }
  // 부원이 공개 Q&A에 막 들어오면 새 답변을 강조하고 읽은 것으로 친다(그 화면에서 시트를 여닫는 것은 새로 들어온 것으로 치지 않는다)

  else state.__freshQs = null;
  현재 = r;
  화면기록(r);

}

function 결론줄(tx) {
  const c = 결과코드(tx);

  if (!tx.reason) return 줄('', 'clock', '총무가 아직 근거를 붙이지 않았어요', `근거가 올라오면 ${CONFIG.rules.periodDays}일 동안 익명 확인이 열려요. 그 전에도 공개 Q&A로 물어볼 수 있어요.`);
  if (c === 'pending') return 줄('', 'clock', '아직 모의 대조 전이에요', '거래 금액·날짜를 영수증과 비교해 볼 수 있어요.', '<button type="button" class="btn primary" id="evi-run" data-act="run">지금 모의 대조 실행</button>');
  const 비교 = `거래 ${원(tx.amount)} · 영수증 ${tx.receiptAmount > 0 ? 원(tx.receiptAmount) : '없음'} · 모의 대조`;

  }

// 배너가 돌아가는 광고 띠. 띠가 절반 이상 보이는 동안 화면에 멈춰 있는 배너마다 노출(ad_view)을 한 번씩 센다 — 배너별 클릭률의 분모.
// 같은 화면에서는 배너마다 한 번만 센다(다시 그려도, 한 바퀴 더 돌아도 늘지 않는다). 지나가기만 한 배너는 세지 않는다
function 광고노출기록() {
  if (!통계켜짐 || !광고보임 || document.hidden || !광고순서) return;
  const b = 광고순서[광고쪽], id = 화면번호 + ':' + b.key;
  if (광고기록.has(id)) return;

function 광고노출확인() {
  if (광고관찰) { 광고관찰.disconnect(); 광고관찰 = null; }
  clearInterval(광고타이머); 광고타이머 = 0; 광고보임 = false;
  const el = document.querySelector('.adband');
  if (!el || !광고순서) return;
  const 띠 = el.querySelector('.adtrack'), 점 = el.querySelectorAll('.addots i'), 주기 = CONFIG.ad.interval;
  띠.scrollLeft = 광고쪽 * 띠.clientWidth;   // 다시 그려도 보던 배너에서 이어 간다
  // 넘기는 동안 지나치는 배너는 세지 않도록, 멈춘 뒤(스크롤이 120ms 쉰 뒤)의 배너만 현재로 친다

      광고보임 = 목록.some(e => e.isIntersecting && e.intersectionRatio >= 0.5);

  } else { 광고보임 = true; 광고노출기록(); }
  // 화면 움직임을 줄이도록 설정한 사람에게는 저절로 넘기지 않는다(손으로 넘길 수는 있다). 손으로 넘긴 직후 한 주기는 건너뛴다

      띠.scrollTo({ left: ((광고쪽 + 1) % 광고순서.length) * 띠.clientWidth, behavior: 'smooth' });
    }, 주기);
  }
}

/* 혜택 탭 가짜 문: 버튼을 누르면 '아직 없는 기능'이라고 밝히고 쓸 의향을 묻는다.

/* 샘플 설문: 혜택 탭 '용돈 미션'의 설문 카드를 누르면 열린다(리서치 회사가 맡기는 설문 일감의 예시).

// Esc는 모달, 시트 순서로 닫고, 시트 안에서는 Tab이 시트 밖으로 나가지 않게 한다(포커스 가두기)
document.addEventListener('keydown', ev => {
  const modal = document.getElementById('modalLayer');
  const sheet = document.getElementById('sheetLayer');
  if (ev.key === 'Escape') {
    if (!modal.hidden) { if (!modal.querySelector('[data-gate]')) 모달닫기(); ev.preventDefault(); return; }
    if (!sheet.hidden && 현재.sheet) { 시트닫기(); ev.preventDefault(); }
    return;
  }
  if (ev.key === 'Tab') {
    const box = !modal.hidden ? modal.querySelector('.modal') : (!sheet.hidden && 현재.sheet ? sheet.querySelector('.sheet') : null);
    if (!box) return;
    const items = [...box.querySelectorAll('button:not([disabled]), input, select, textarea, summary, [tabindex]:not([tabindex="-1"])')].filter(x => x.offsetParent !== null);
    if (!items.length) return;
    const first = items[0], last = items[items.length - 1];
    if (ev.shiftKey && document.activeElement === first) { last.focus(); ev.preventDefault(); }
    else if (!ev.shiftKey && document.activeElement === last) { first.focus(); ev.preventDefault(); }
    else if (!box.contains(document.activeElement)) { first.focus(); ev.preventDefault(); }
  }
});
